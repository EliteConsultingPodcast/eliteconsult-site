name: Enable GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "${payload}")
          echo "POST ${code}"
          cat /tmp/pages.json
          echo
          if [ "${code}" = "201" ] || [ "${code}" = "409" ]; then
            exit 0
          fi
          code2=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "${payload}")
          echo "PUT ${code2}"
          cat /tmp/pages-put.json
          echo
          if [ "${code2}" = "200" ] || [ "${code2}" = "201" ]; then
            exit 0
          fi
          exit 1
